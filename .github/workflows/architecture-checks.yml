name: Architecture Regression Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Characterize router contract
        run: php .github/ci/php-router-characterization.php

      - name: Characterize path matcher seam
        run: php .github/ci/php-path-matcher-characterization.php

      - name: Characterize dispatch contract
        run: php .github/ci/php-dispatch-characterization.php

      - name: Characterize explicit request context
        run: php .github/ci/php-request-context-characterization.php

      - name: Audit public request globals
        run: python3 .github/ci/php-public-request-state-audit.py

      - name: Audit request-state boundary
        run: python3 .github/ci/php-request-state-boundary-audit.py

      - name: Audit legacy alias boundary
        run: python3 .github/ci/php-legacy-alias-audit.py

      - name: Enforce architecture contract
        run: python3 .github/ci/php-architecture-contract-audit.py

      - name: Audit extracted domain query boundaries
        run: python3 .github/ci/php-domain-query-boundary-audit.py

      - name: Audit retired runtime boundary
        run: python3 .github/ci/php-retired-runtime-audit.py

      - name: Audit active alias boundary
        run: python3 .github/ci/php-active-alias-boundary-audit.py

      - name: Audit compatibility residue
        run: python3 .github/ci/php-compatibility-residue-audit.py

      - name: Audit consumer graph
        run: python3 .github/ci/php-consumer-graph-audit.py

      - name: Audit classified schema introspection
        run: python3 .github/ci/php-schema-contract-audit.py

      - name: Audit Gift availability bridge integration
        run: |
          php -l app/domains/systems/queries.php
          python3 .github/ci/php-gift-availability-bridge-audit.py

      - name: Characterize runtime regressions
        run: php .github/ci/php-runtime-regression.php

      - name: Audit canonical basal Form contract
        run: python3 .github/ci/php-basal-form-contract-audit.py

      - name: Audit Form roll context propagation
        run: |
          php -l app/controllers/tool/dice_roller.php
          php -l app/domains/dice/form_effects.php
          php -l app/mobile/controllers/character_detail.php
          node --check assets/js/hg-mobile-form-dice-context.js
          python3 .github/ci/php-form-roll-context-audit.py

      - name: Audit archived games stay out of production
        run: python3 .github/ci/php-retired-games-archive-audit.py

      - name: Characterize public runtime seams
        run: php .github/ci/php-public-runtime-characterization.php

      - name: Characterize Admin shell and security
        run: php .github/ci/php-admin-shell-characterization.php

      - name: Audit Admin procedural debt baseline
        run: python3 .github/ci/php-admin-debt-audit.py

      - name: Audit Admin domain boundaries
        run: python3 .github/ci/php-admin-domain-boundary-audit.py

      - name: Audit final Admin structure
        run: python3 .github/ci/php-admin-structural-audit.py

      - name: Audit Admin UX foundation
        run: python3 .github/ci/php-admin-ux-foundation-audit.py

      - name: Audit Admin usage telemetry
        run: python3 .github/ci/php-admin-usage-audit.py

      - name: Check dense Admin table JavaScript
        run: node --check assets/js/hg-admin-dense-tables.js

      - name: Enforce runtime architecture baseline
        run: python3 .github/ci/php-runtime-baseline-audit.py

      - name: Enforce performance contracts
        run: python3 .github/ci/php-performance-contract-audit.py

      - name: Enforce mobile shared-data boundary
        run: python3 .github/ci/php-mobile-shared-data-audit.py

      - name: Enforce mobile presentation boundary
        run: python3 .github/ci/php-mobile-presentation-audit.py

      - name: Enforce PWA contract
        run: python3 .github/ci/php-pwa-contract-audit.py

      - name: Enforce public SQL boundary
        run: python3 .github/ci/php-public-sql-boundary-audit.py

      - name: Check PWA JavaScript
        run: |
          node --check assets/js/hg-pwa.js
          node --check service-worker.js

      - name: Report architecture regression status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HG_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          if [ "$HG_JOB_STATUS" = "success" ]; then state=success; fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"Architecture Regression Checks\",\"description\":\"Architecture regression CI ${state}\"}"
