name: CSS Phase 1 codemod

on:
  push:
    branches:
      - css-refactor
    paths:
      - '.github/ci/phase1_css_migrate.py'
      - '.github/workflows/css-phase1-codemod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: css-refactor
          fetch-depth: 0

      - name: Run Phase 1 CSS migration
        run: python3 .github/ci/phase1_css_migrate.py

      - name: Lint PHP and check patch
        shell: bash
        run: |
          set -euo pipefail
          find app api -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l index.php
          git diff --check

      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app assets/css/pages/legacy
          git commit -m "refactor: migrate legacy public CSS emitters"
          git push origin HEAD:css-refactor
