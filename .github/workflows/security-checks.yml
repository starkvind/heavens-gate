name: Project CI

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find app api -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l index.php

      - name: Guard CSS architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/css-architecture-guard.py

      - name: Security regression guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path("app"), Path("api")]
          forbidden = {
              "$_COOKIE['is_admin']": "client-controlled admin cookie",
              '$_COOKIE["is_admin"]': "client-controlled admin cookie",
              "$_POST['tournament_background']": "client-controlled tournament bypass",
              '$_POST["tournament_background"]': "client-controlled tournament bypass",
              "$_GET['debug_forced_rolls']": "forced dice API input",
              '$_GET["debug_forced_rolls"]': "forced dice API input",
              "$_POST['debug_forced_rolls']": "forced dice form input",
              '$_POST["debug_forced_rolls"]': "forced dice form input",
          }

          failures = []
          for root in roots:
              for path in root.rglob("*.php"):
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  for needle, label in forbidden.items():
                      if needle in text:
                          failures.append(f"{path}: {label}: {needle}")

          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Guard private repository trees
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.htaccess').read_text(encoding='utf-8', errors='ignore')
          security_start = source.find('# Security')
          boundary = source.find('# Existing files and folders')
          if security_start < 0 or boundary < 0 or boundary <= security_start:
              raise SystemExit('Could not locate the security/private-tree boundary in .htaccess')

          security_block = source[security_start:boundary]
          required = [
              r'RewriteRule ^\.github(?:/|$) index.php?p=error404 [L,NC,QSA]',
              r'RewriteRule ^app(?:/|$) index.php?p=error404 [L,NC,QSA]',
              r'RewriteRule (^|/)admin_docs(?:/|$) index.php?p=error404 [L,NC,QSA]',
          ]
          physical_private_tree_guard = (
              'RewriteCond %{REQUEST_FILENAME} -f [OR]\n'
              'RewriteCond %{REQUEST_FILENAME} -d\n'
              'RewriteRule ^(?:tools|sql)(?:/|$) index.php?p=error404 [L,NC,QSA]'
          )

          failures = []
          for rule in required:
              if rule not in security_block:
                  failures.append(f'Missing private-tree rule before existing-file bypass: {rule}')

          if physical_private_tree_guard not in security_block:
              failures.append(
                  'Physical /tools and /sql guard is missing or unconditioned; '
                  'virtual routes such as /tools/forum-topic-viewer must remain routable.'
              )

          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Verify dynamic cache and global asset versioning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          head = Path("app/bootstrap/head_work.php").read_text(encoding="utf-8", errors="ignore")
          index = Path("index.php").read_text(encoding="utf-8", errors="ignore")

          required_head = [
              "assets/css/hg-core.css?v=<?= $coreCssVersion ?>",
              "assets/css/hg-layout.css?v=<?= $layoutCssVersion ?>",
              "assets/css/hg-menu.css?v=<?= $menuCssVersion ?>",
              "assets/js/permutloading.js?v=<?= $permutScriptVersion ?>",
              "assets/js/hg-tabs.js?v=<?= $tabsScriptVersion ?>",
              "assets/js/hg-tooltip.js?v=<?= $tooltipScriptVersion ?>",
              "@filemtime(__DIR__ . '/../../assets/css/hg-core.css')",
              "@filemtime(__DIR__ . '/../../assets/css/hg-layout.css')",
              "@filemtime(__DIR__ . '/../../assets/css/hg-menu.css')",
              "@filemtime(__DIR__ . '/../../assets/js/permutloading.js')",
              "@filemtime(__DIR__ . '/../../assets/js/hg-tabs.js')",
              "@filemtime(__DIR__ . '/../../assets/js/hg-tooltip.js')",
          ]
          missing = [item for item in required_head if item not in head]
          if missing:
              raise SystemExit("Global asset versioning is incomplete:\n" + "\n".join(missing))

          if "?: time()" in head:
              raise SystemExit("Do not use time() as the global asset-version fallback; it defeats browser caching.")

          cache_header = "Cache-Control: no-cache, max-age=0, must-revalidate"
          if cache_header not in index:
              raise SystemExit("Dynamic HTML must remain cacheable only with mandatory revalidation.")
          if "Cache-Control: no-store" in index:
              raise SystemExit("Do not disable dynamic HTML storage globally; revalidate it instead.")
          PY

      - name: Guard tool API auth and legacy deserialization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          failures = []

          for path in [
              Path("app/controllers/tool/dice_api.php"),
              Path("app/controllers/tool/forum_avatar_api.php"),
          ]:
              source = path.read_text(encoding="utf-8", errors="ignore")
              if "$_GET['token']" in source or '$_GET["token"]' in source:
                  failures.append(f"{path}: API token must not be read directly from the query string")
              if "hg_tool_api_require_request_token()" not in source:
                  failures.append(f"{path}: shared request-token authentication is missing")

          helper = Path("app/helpers/tool_api.php").read_text(encoding="utf-8", errors="ignore")
          if "HTTP_AUTHORIZATION" not in helper or "Bearer" not in helper:
              failures.append("app/helpers/tool_api.php: Bearer-token support is missing")

          for path in Path("app").rglob("*.php"):
              source = path.read_text(encoding="utf-8", errors="ignore")
              for match in re.finditer(r'(?:@)?unserialize\s*\(([^\n;]*)\)', source):
                  if "allowed_classes" not in match.group(1):
                      failures.append(f"{path}: unserialize without allowed_classes=false")

          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Exercise admin login rate limiter
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $_SERVER["REMOTE_ADDR"] = "203.0.113.250";
            require "app/helpers/admin_login_rate_limit.php";
            hg_admin_login_rate_reset();
            $state = hg_admin_login_rate_status();
            if (!empty($state["blocked"])) { exit(1); }
            for ($i = 0; $i < 10; $i++) {
                $state = hg_admin_login_rate_record_failure();
            }
            if (empty($state["blocked"])) { exit(2); }
            if ((int)($state["retry_after"] ?? 0) <= 0) { exit(3); }
            hg_admin_login_rate_reset();
            $state = hg_admin_login_rate_status();
            if (!empty($state["blocked"]) || (int)($state["failures"] ?? -1) !== 0) { exit(4); }
          '

      - name: Reject schema-changing SQL in web runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'\b(?:ALTER|CREATE|DROP|TRUNCATE)\s+TABLE\b', re.I)
          failures = []
          roots = [Path("app/controllers"), Path("app/helpers")]
          for root in roots:
              for path in root.rglob("*.php"):
                  source = path.read_text(encoding="utf-8", errors="ignore")
                  if pattern.search(source):
                      failures.append(str(path))

          if failures:
              raise SystemExit(
                  "Schema-changing SQL is not allowed in web runtime controllers/helpers:\n"
                  + "\n".join(failures)
              )
          PY