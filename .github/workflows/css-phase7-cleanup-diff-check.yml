name: CSS Phase 7 cleanup diff check

on:
  push:
    branches: [css-refactor]
    paths:
      - '.github/workflows/css-phase7-cleanup-diff-check.yml'

permissions:
  contents: read

jobs:
  diff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Phase 7 diff whitespace
        run: git diff --check 08b53b43ba3b00a339e380dfd29eff4934dd95e8 HEAD
