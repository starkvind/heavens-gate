name: CSS Architecture

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard CSS architecture
        run: python3 .github/ci/css-architecture-guard.py 2>&1 | tee css-architecture-guard.txt

      - name: Upload guard diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: css-architecture-guard
          path: css-architecture-guard.txt
