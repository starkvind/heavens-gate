name: CSS Phase 5 Cleanup

on:
  push:
    branches:
      - css-refactor

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: css-refactor

      - name: Add permanent hg-main regression guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/security-checks.yml')
          text = path.read_text(encoding='utf-8')

          anchor_failures = """          failures = []

          # Every literal local stylesheet referenced by PHP should exist.
"""
          replacement_failures = """          failures = []

          # hg-main.css was retired in CSS refactor phase 5 and must never return.
          if Path("assets/css/hg-main.css").exists():
              failures.append("assets/css/hg-main.css: retired legacy bundle must not be restored")

          # Every literal local stylesheet referenced by PHP should exist.
"""
          if anchor_failures not in text:
              raise SystemExit('Could not locate CSS-reference guard anchor')
          text = text.replace(anchor_failures, replacement_failures, 1)

          anchor_source = """                  source = path.read_text(encoding="utf-8", errors="ignore")
                  for ref in sorted(set(css_ref.findall(source))):
"""
          replacement_source = """                  source = path.read_text(encoding="utf-8", errors="ignore")
                  if "/assets/css/hg-main.css" in source:
                      failures.append(f"{path}: forbidden retired stylesheet reference /assets/css/hg-main.css")
                  for ref in sorted(set(css_ref.findall(source))):
"""
          if anchor_source not in text:
              raise SystemExit('Could not locate PHP stylesheet scan anchor')
          text = text.replace(anchor_source, replacement_source, 1)
          path.write_text(text, encoding='utf-8')

          if Path('assets/css/hg-main.css').exists():
              raise SystemExit('hg-main.css unexpectedly exists before guard commit')
          PY

      - name: Remove temporary phase workflow and commit guard
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/css-phase5-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/security-checks.yml
          git diff --cached --check
          git commit -m 'chore(css): guard retired hg-main bundle'
          git push origin HEAD:css-refactor
