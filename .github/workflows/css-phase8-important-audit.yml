name: CSS Phase 8 cleanup

on:
  push:
    branches: [css-refactor]
    paths:
      - '.github/workflows/css-phase8-important-audit.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded Phase 8 cleanup
        run: python .github/css-phase8-cleanup.py

      - name: Validate generated diff
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re

          css_root = Path('assets/css')
          excluded = {
              css_root / 'hg-admin.css',
              css_root / 'hg-mobile.css',
              css_root / 'hg-mobile-timeline.css',
          }
          print_only = {
              css_root / 'hg-powers-print.css',
              css_root / 'hg-power-custom.css',
          }
          expected_counts = {
              css_root / 'hg-datatables.css': 3,
              css_root / 'hg-maps.css': 1,
              css_root / 'hg-components.css': 1,
          }

          unexpected = []
          observed = {}
          high_specificity = []

          for path in css_root.rglob('*.css'):
              if path in excluded:
                  continue
              text = path.read_text()
              clean = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              count = clean.count('!important')
              observed[path] = count

              if path in print_only:
                  continue
              if path in expected_counts:
                  if count != expected_counts[path]:
                      unexpected.append(f'{path}: expected {expected_counts[path]} !important declarations, found {count}')
              elif count:
                  unexpected.append(f'{path}: unexpected !important declarations: {count}')

              for selector_block in re.finditer(r'([^{}]+)\{', clean):
                  selector = selector_block.group(1).strip()
                  if selector.startswith('@'):
                      continue
                  for branch in selector.split(','):
                      branch = branch.strip()
                      ids = len(re.findall(r'#[A-Za-z0-9_-]+', branch))
                      classes = len(re.findall(r'\.[A-Za-z0-9_-]+|\[[^\]]+\]|:(?!:)[A-Za-z0-9_-]+', branch))
                      if ids >= 2 or classes >= 6:
                          high_specificity.append((str(path), branch, ids, classes))

          print('=== Remaining public !important counts ===')
          for path in sorted(observed, key=str):
              if observed[path]:
                  print(f'{path}: {observed[path]}')

          print('=== High-specificity candidates (audit only) ===')
          for item in high_specificity:
              print(f'{item[0]}: ids={item[2]} classes/attrs/pseudos={item[3]} :: {item[1]}')

          if unexpected:
              raise SystemExit('\n'.join(unexpected))
          PY

      - name: Remove one-use Phase 8 tooling and commit
        run: |
          rm .github/css-phase8-cleanup.py
          rm .github/workflows/css-phase8-important-audit.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No Phase 8 changes staged'; exit 1; }
          git commit -m 'refactor: reduce public specificity debt'
          git push origin HEAD:css-refactor
