name: Install help screenshots

on:
  push:
    paths:
      - '.github/workflows/help-screenshots-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Materialize WebP screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/img/help

          fetch_blob() {
            local sha="$1"
            local dest="$2"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | python3 -c 'import base64,json,sys; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
              > "$dest"
          }

          fetch_blob f887d32594237952c6075bb93ba032f2c85c3f14 public/img/help/help-basic-01-home.webp
          fetch_blob affe72e9e0e325821120e043649bcd49da14c7db public/img/help/help-basic-02-menu.webp
          fetch_blob a174b0f69b4747e1c0332e877885ef3894fd050a public/img/help/help-basic-03-search.webp
          fetch_blob 01179843ff2bf8dec39feedfa1b651fab6924078 public/img/help/help-basic-04-character.webp
          fetch_blob ca91b48d18b52c7dbc4a19b6b6aaaed61f8e6489 public/img/help/help-basic-05-chapter.webp
          fetch_blob 22df3935f704dceb6b9be676662a89fb5a6f5965 public/img/help/help-basic-06-mobile-menu.webp
          fetch_blob 7f620417aab0eafef3453378dc9a4259ea2abfca public/img/help/help-basic-07-mobile-pwa.webp
          fetch_blob acb07220aa5722f42f33a6045e7550f9af038210 public/img/help/help-forum-01-selector.webp
          fetch_blob 3583799974f23e1fac6f9967bb1d45255d63d721 public/img/help/help-forum-02-reader.webp
          fetch_blob 10c55fe70ff7e8b794c5249121bcf11d86b81c7d public/img/help/help-forum-03-toc.webp

          file public/img/help/*.webp
          git add public/img/help
          git diff --cached --quiet && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add help screenshots"
          git push origin HEAD:master
