      - 'app/controllers/admin/admin_resources.php'
      - 'app/controllers/admin/admin_merits_flaws.php'
      - 'app/controllers/admin/admin_traits.php'
      - 'app/controllers/admin/admin_characters.php'
      - 'app/mobile/controllers/powers.php'
      - 'app/controllers/pwrs/disc_page.php'
      - 'app/controllers/pwrs/totm_page.php'
      - 'app/controllers/pwrs/rite_page.php'
      - 'app/controllers/pwrs/don_page.php'
      - 'app/domains/powers/admin.php'
      - 'app/controllers/admin/admin_powers.php'
      - 'app/mobile/controllers/season_detail.php'
      - 'app/controllers/chapters/season_archive.php'
      - 'app/domains/chapters/admin_seasons.php'
      - 'app/controllers/admin/admin_seasons.php'
      - 'app/controllers/systems/system_detail_page.php'
      - 'app/domains/systems/admin_details.php'
      - 'app/controllers/admin/admin_system_details.php'
      - 'app/mobile/controllers/systems.php'
      - 'app/controllers/systems/system_form_page.php'
      - 'app/controllers/systems/system_overview_page.php'
      - 'app/mobile/controllers/inventory.php'
      - 'app/controllers/docs/item_page.php'
      - 'app/domains/systems/admin.php'
      - 'app/domains/inventory/admin.php'
      - 'app/controllers/admin/admin_forms.php'
      - 'app/controllers/admin/admin_systems.php'
      - 'app/controllers/admin/admin_items.php'
      - 'app/mobile/controllers/chapter_detail.php'
      - 'app/controllers/chapters/chapter_page.php'
      - 'app/domains/chapters/admin.php'
      - 'app/controllers/admin/admin_chapters.php'
      - 'tools/audit_rich_html.php'
      - 'app/mobile/controllers/news.php'
      - 'app/controllers/main/main_news.php'
      - 'app/domains/news/admin.php'
      - 'app/controllers/admin/admin_news.php'
      - 'app/mobile/controllers/documents.php'
      - 'app/controllers/docs/docs_page.php'
      - 'app/domains/documents/admin_docs.php'
      - 'app/controllers/admin/admin_docs.php'
      - '.github/ci/php-html-sanitizer-regression.php'
      - '.github/workflows/html-sanitizer-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom
          tools: composer:v2
          coverage: none
      - name: Install locked candidate and check advisories
        working-directory: app/security
        run: |
          composer validate --no-check-publish
          composer install --no-dev --no-interaction --no-plugins --no-scripts --prefer-dist
          composer audit --locked --no-dev
          git diff --exit-code -- composer.lock
      - name: Run candidate regression
        run: |
          php -l app/helpers/html_sanitizer.php
          php -l tools/audit_rich_html.php
          php tools/audit_rich_html.php --self-test
          php .github/ci/php-html-sanitizer-regression.php
