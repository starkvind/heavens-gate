permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom
          tools: composer:v2
          coverage: none
      - name: Install locked candidate and check advisories
        working-directory: app/security
        run: |
          composer validate --no-check-publish
          composer install --no-dev --no-interaction --no-plugins --no-scripts --prefer-dist
          composer audit --locked --no-dev
          git diff --exit-code -- composer.lock
      - name: Run candidate regression
        run: |
          php -l app/helpers/html_sanitizer.php
          php -l tools/audit_rich_html.php
          php tools/audit_rich_html.php --self-test
          php .github/ci/php-html-sanitizer-regression.php
      - name: Measure current Quill round-trip in Chromium
        run: |
          php .github/ci/quill-roundtrip-browser.php > quill-roundtrip-fixture.html
          trap 'rm -f quill-roundtrip-fixture.html quill-roundtrip-output.html' EXIT
          google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking --no-first-run --virtual-time-budget=2000 --dump-dom "file://${GITHUB_WORKSPACE}/quill-roundtrip-fixture.html" > quill-roundtrip-output.html
          python3 - <<'PY'
          import html
          import json
          import re
          from pathlib import Path
          page = Path("quill-roundtrip-output.html").read_text()
          match = re.search(r'<pre id="result"[^>]*>(.*?)</pre>', page, re.S)
          if not match:
              raise SystemExit("No browser report")
          data = json.loads(html.unescape(match.group(1)))
          print("HG_QUILL_REPORT " + json.dumps(data, ensure_ascii=False))
          if data.get("error") or not data.get("baseline_ok"):
              raise SystemExit("Quill baseline failed")
          if not data.get("rich_ok"):
              print("::warning::Quill rich round-trip loses structure or mention metadata. Deployment remains blocked by compatibility review.")
          PY
  inventory-db:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: hg-ci-only
          MARIADB_DATABASE: hg_fixture
          MARIADB_USER: hg_fixture_writer
          MARIADB_PASSWORD: hg-ci-writer
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mysqli
          tools: composer:v2
          coverage: none
      - name: Install locked sanitizer
        working-directory: app/security
        run: composer install --no-dev --no-interaction --no-plugins --no-scripts --prefer-dist
      - name: Verify historical inventory on disposable MariaDB
        run: php .github/ci/php-historic-html-inventory.php
