  pull_request:
    branches: [master]
    paths:
      - 'app/security/**'
      - 'app/helpers/html_sanitizer.php'
      - 'app/controllers/tool/csp_board.php'
      - 'app/helpers/mentions.php'
      - 'app/mobile/controllers/rules.php'
      - 'app/controllers/docs/merfla_page.php'
      - 'app/controllers/docs/traits_page.php'
